name: Build Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Tectonic Plugin
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            asset_name: Tectonic-Windows
          - os: macos-latest
            asset_name: Tectonic-macOS

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install cmake -y
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install cmake
          fi
        shell: bash

      - name: Configure and build
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release --parallel 4

      - name: Find VST3 artifact
        id: find_vst3
        run: |
          VST3_PATH=$(find build -name "*.vst3" -type d | head -1)
          echo "vst3_path=$VST3_PATH" >> $GITHUB_OUTPUT
        shell: bash

      - name: Create release archive
        run: |
          mkdir -p artifacts
          cd build
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path '${{ steps.find_vst3.outputs.vst3_path }}' -DestinationPath '../artifacts/Tectonic-Windows.zip'"
          else
            zip -r ../artifacts/Tectonic-macOS.zip "${{ steps.find_vst3.outputs.vst3_path }}"
          fi
        shell: bash

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/Tectonic-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
